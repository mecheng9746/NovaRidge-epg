name: Test CA2 Live Feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ca2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test Disney Channel Canada HD live XMLTV
        run: |
          python - <<'PY'
          import gzip, tempfile, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          url = "https://epgshare01.online/epgshare01/epg_ripper_CA2.xml.gz"
          target = "Disney.Channel.Canada.HD.ca2"
          with tempfile.TemporaryDirectory() as tmp:
              path = Path(tmp) / "ca2.xml.gz"
              req = urllib.request.Request(url, headers={"User-Agent": "NovaRidge-CA2-Test/1.0"})
              with urllib.request.urlopen(req, timeout=90) as response, path.open("wb") as out:
                  total = 0
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      if total > 100 * 1024 * 1024:
                          raise RuntimeError("Feed exceeded 100MB limit")
                      out.write(chunk)
              print("Downloaded compressed bytes:", total)
              if total < 10000:
                  raise RuntimeError("Source feed unexpectedly small")
              now = datetime.now(timezone.utc)
              channel_found = False
              upcoming = []
              with gzip.open(path, "rb") as stream:
                  for _, element in ET.iterparse(stream, events=("end",)):
                      if element.tag == "channel" and element.get("id") == target:
                          channel_found = True
                      if element.tag == "programme" and element.get("channel") == target:
                          raw = element.get("start", "")
                          try:
                              start = datetime.strptime(raw.strip(), "%Y%m%d%H%M%S %z").astimezone(timezone.utc)
                          except ValueError:
                              start = None
                          if start and now - timedelta(hours=6) <= start <= now + timedelta(days=7):
                              upcoming.append(start)
                      element.clear()
              if not channel_found:
                  raise RuntimeError("Disney Channel HD ID not found in live CA2 feed")
              if len(upcoming) < 3 or max(upcoming, default=now) < now + timedelta(hours=12):
                  raise RuntimeError(f"Insufficient future programme coverage: {len(upcoming)} listings")
              print("PASS — Disney Channel Canada HD channel exists")
              print("Programme count:", len(upcoming))
              print("Last upcoming programme starts:", max(upcoming).isoformat())
          PY
