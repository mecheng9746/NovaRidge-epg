name: TELUS LIVECHANNELS catalog pilot
on:
  pull_request:
    paths:
      - 'scripts/collect_telus_livechannels.py'
      - 'tests/test_telus_livechannels.py'
      - '.github/workflows/telus-livechannels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install 'lxml>=5,<7'
      - name: Test source collectors
        run: python -m unittest discover -s tests -v
      - name: Collect six regional channel catalogs
        run: python scripts/collect_telus_livechannels.py
      - name: Upload catalog files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telus-livechannel-catalogs
          path: _catalogs/
          if-no-files-found: warn
          retention-days: 7
