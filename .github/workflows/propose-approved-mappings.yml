name: Propose approved EPG mappings (Stage 3)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: epg-stage3-proposals
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'google-auth>=2,<3' requests
      - name: Run Stage 3 offline tests
        run: python -m unittest discover -s tests -p 'test_stage3_proposals.py' -v
      - name: Read reviewed candidates and create draft PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/propose_approved_mappings.py
