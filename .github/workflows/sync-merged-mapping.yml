name: Sync merged EPG mapping to Canadian Master
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: epg-sheet-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'proposal/epg-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google Sheets dependencies
        run: python -m pip install 'google-auth>=2,<3' requests
      - name: Synchronize reviewed mapping
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_merged_mapping.py
