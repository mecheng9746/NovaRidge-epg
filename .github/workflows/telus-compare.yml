name: Compare TELUS Region Schedules
on:
  pull_request:
    paths:
      - 'scripts/compare_telus_regions.py'
      - 'tests/test_compare_telus_regions.py'
      - '.github/workflows/telus-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'lxml>=5,<7'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare 24-hour regional schedules
        run: python scripts/compare_telus_regions.py --hours 24 --delay 2
      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telus-schedule-comparisons
          path: _comparisons/
          retention-days: 7
          if-no-files-found: warn
