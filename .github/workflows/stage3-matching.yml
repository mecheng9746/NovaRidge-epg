name: Stage 3 Candidate Matching Pilot
on:
  pull_request:
    paths:
      - 'scripts/stage3_match_candidates.py'
      - 'tests/test_stage3_match_candidates.py'
      - 'data/stage3-canadian-playlist.json'
      - '.github/workflows/stage3-matching.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matching:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'lxml>=5,<7'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build identity candidates
        run: python scripts/stage3_match_candidates.py
      - name: Upload matching report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-identity-candidates
          path: |
            _stage3/match-candidates.csv
            _stage3/summary.json
          retention-days: 7
          if-no-files-found: warn
